<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Slider</title>
</head>
<body>
    <div class="slider-container">
        <div class="slide-number" id="slide-number"></div>
        <img src="https://placehold.co/800x250/orange/fff.png" alt="">
        <img src="https://placehold.co/800x250/red/fff.png" alt="" >
        <img src="https://placehold.co/800x250/coral/fff.png" alt="">
        <img src="https://placehold.co/800x250/tomato/fff.png" alt="">
        <img src="https://placehold.co/800x250/cyan/fff.png" alt="">
    </div>
    <div class="slider-controls">
        <span id="prev" class="prev">Previous</span>
        <span id="indicators" class="indicators"></span>
        <span id="next" class="next">next</span>
    </div>
    <script src="main.js"></script>
</body>
</html>
